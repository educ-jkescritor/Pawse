<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="main-titlebar">
        <div class="title">
            <button id="menu-btn">
                <img src="../assets/logos/logo.png" alt="pawse-logo">
            </button>
            <div class="title-roller font-pixel-16-bold">
                <div class="roller-content">
                    <div class="roller-text">PAWSE</div>
                    <div class="roller-text">SETTINGS</div>
                </div>
            </div>
        </div>
        <div class="main-window-controls">
            <button id="minimize-btn">
                <img src="../assets/icons/minimize-btn.png" alt="minimize">
            </button>
            <button id="close-btn">
                <img src="../assets/icons/close-btn.png" alt="close">
            </button>
        </div>
    </header>

    <div>
        <h1>LOGIN</h1>
        <form id ="login-form">
            <input type="text" placeholder="Username" id="username">
            <input type="password" placeholder="Password" id="password">
            <button id="login-btn">Login</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
