<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<title>Document</title>-->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app-wrapper">
    <header class="main-titlebar">
        <div class="title">
            <img src="../assets/logos/logo.png" alt="pawse-logo" class="app-logo">
            <span class="app-title font-pixel-16-bold">PAWSE</span>
        </div>
        <div class="main-window-controls">
            <button id="hub-btn" title="Hub">
                <img src="../assets/icons/hub-btn.png" alt="hub">
            </button>

            <div class="button-divider"></div>

            <button id="minimize-btn" title="Minimize">
                <img src="../assets/icons/minimize-btn.png" alt="minimize">
            </button>
            <button id="close-btn" title="Close">
                <img src="../assets/icons/close-btn.png" alt="close">
            </button>
        </div>
    </header>

    <div class="main-content">
        <div class="main-text">
            <span class="font-inter-16-medium">Choose your</span> <span class="font-pixel-20-regular text-system-blue" id="companion-title-text">Companion</span><br>
        </div>

        <div class="cat_buttons">
            <button id="tuxedo_cat">
                <span class="cat_info">
                    <span class="cat-label cat-label-classic font-inter-10-medium">Classic</span>
                    <span class="font-pixel-32-bold">Tux</span>
                    <span class="font-inter-12-regular">25m Focus / 5m Break</span>
                </span>
                <span class="cat_image">
                    <img src="../assets/sprites/tuxedo_cat_static.png" alt="tuxedo-cat">
                </span>
            </button>

            <button id="orange_cat">
                <span class="cat_info">
                    <span class="cat-label cat-label-sprint font-inter-10-medium">Sprint</span>
                    <span class="font-pixel-32-bold">Ginger</span>
                    <span class="font-inter-12-regular">15m Focus / 3m Break</span>
                </span>
                <span class="cat_image">
                    <img src="../assets/sprites/orange_cat_static.png" alt="orange-cat">
                </span>
            </button>

            <button id="black_cat">
                <span class="cat_info">
                    <span class="cat-label cat-label-focused font-inter-10-medium">Focused</span>
                    <span class="font-pixel-32-bold">Void</span>
                    <span class="font-inter-12-regular">50m Focus / 10m Break</span>
                </span>
                <span class="cat_image">
                    <img src="../assets/sprites/black_cat_static.png" alt="black-cat">
                </span>
            </button>
        </div>

        <button class="confirmation_button font-inter-12-medium" disabled>Confirm Selection</button>
    </div>
    </div>
    
    <script src="index.js"></script>
    <script src="titlebar.js"></script>
</body>
</html>
